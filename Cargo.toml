[workspace]
members = [
  "apps/ui",
  "crates/api-client",
  "crates/api-types",
  "crates/cli",
  "crates/core",
  "crates/daemon",
  "crates/nix",
  "crates/privileged",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
dioxus = { version = "0.7", default-features = false, features = ["html", "macro", "signals"] }
dioxus-ssr = "0.7"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
utoipa = "6"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
